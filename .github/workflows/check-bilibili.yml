name: Check Bilibili cards

# 检查内置 B 站卡是否还在线，并搜索可替换的中德字幕视频
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-bilibili.yml, scripts/check_bilibili.py]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_bilibili.py
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili
          path: bilibili.json
