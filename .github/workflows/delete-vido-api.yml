name: 下线旧的 vido-api（一次性）
# 站长 2026-11-03 同意删除：Vido 已并入手册后端，vido-api Worker 和 D1 vido 不再使用。
on:
  push:
    branches: [claude/project-thread-yid8z0]
    paths: [.github/workflows/delete-vido-api.yml]
jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: npm i -g wrangler@4 >/dev/null && wrangler --version
      - name: 删除 Worker vido-api
        run: wrangler delete --name vido-api --force
      - name: 删除 D1 vido
        run: wrangler d1 delete vido --skip-confirmation
      - name: 确认
        run: |
          wrangler d1 list --json | jq -r '.[].name'
          ! wrangler d1 list --json | jq -e '.[] | select(.name=="vido")'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://vido-api.uuoo.workers.dev/api/health); echo "vido-api → $code"
