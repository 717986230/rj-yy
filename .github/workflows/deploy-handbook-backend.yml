name: 部署手册后端

# 手册（www.uuoo.site，仓库 717986230/deutsch-lernen-site）的后端 uuoo-analytics Worker + D1 uuoo_analytics。
# Vido 的数据也存在这里（/api/vido）。手册仓库没有 Cloudflare 密钥，所以借本仓库同一个账号的密钥部署。
# 步骤与手册仓库的 deploy.sh backend 相同；本地文件备份换成记录 D1 Time Travel 恢复点（Cloudflare 保留 30 天）。
# 用法：Actions → 部署手册后端 → Run workflow
on:
  workflow_dispatch:

concurrency:
  group: handbook-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB: uuoo_analytics
    defaults:
      run:
        working-directory: hb/analytics
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 717986230/deutsch-lernen-site
          ref: main
          path: hb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g wrangler@4 && wrangler --version
      - name: 记录 D1 恢复点（出问题可用 wrangler d1 time-travel restore 回到这里）
        run: wrangler d1 time-travel info "$DB"
      - name: 迁移（与 deploy.sh 相同，均可重复执行）
        run: |
          set -o pipefail
          wrangler d1 execute "$DB" --remote --file=migrate-users-recovery.sql 2>&1 | grep -v "duplicate column" || true
          wrangler d1 execute "$DB" --remote --file=migrate-events-geo.sql 2>&1 | grep -v "duplicate column" || true
          wrangler d1 execute "$DB" --remote --file=migrate-drop-phone.sql
          wrangler d1 execute "$DB" --remote --file=migrate-language-profiles.sql
          wrangler d1 execute "$DB" --remote --file=migrate-progress-documents.sql
          wrangler d1 execute "$DB" --remote --file=schema.sql 2>&1 | grep -viE "already exists|duplicate column" || true
      - name: 部署 Worker（--keep-vars：保留后台里配的变量）
        run: wrangler deploy --keep-vars
      - name: 检查
        run: |
          set -e
          api=https://uuoo-analytics.uuoo.workers.dev
          # 新版本在边缘节点生效要几秒到几十秒
          for i in $(seq 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$api/api/vido"); echo "/api/vido 未登录 → $code"
            [ "$code" = 401 ] && break; sleep 6
          done
          [ "$code" = 401 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "$api/api/leaderboard"); echo "/api/leaderboard → $code"; [ "$code" = 200 ]
