name: 手册镜像到 Cloudflare

# 把手册（717986230/deutsch-lernen-site 的 main，纯静态）原样发布成 Cloudflare 的纯静态 Worker（Workers 静态资源，免费）
# https://uuoo-de.uuoo.workers.dev ，作为 uuoo.site 到期后的落脚点（以后拿到 eu.org 等免费域名，也绑在这个 Worker 上）。
# 用 Worker 而不是 Pages：本仓库的 Cloudflare 密钥没有 Pages 权限（实测 Authentication error 10000），但能部署 Worker。
# 手册仓库没有 Cloudflare 密钥，所以和「部署手册后端」一样借本仓库同一账号的密钥。
# 每 2 小时自动同步一次；手动：Actions → 手册镜像到 Cloudflare → Run workflow
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

concurrency:
  group: handbook-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: uuoo-de
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 717986230/deutsch-lernen-site
          ref: main
          path: hb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g wrangler@4 && wrangler --version
      - name: 准备发布目录（只放网站文件，不放源码仓库的杂物）
        run: |
          rsync -a --exclude .git --exclude .github --exclude node_modules --exclude analytics --exclude CNAME hb/ site/
          echo "文件数 $(find site -type f | wc -l)，大小 $(du -sh site | cut -f1)"
      - name: 发布（纯静态资源，没有 Worker 代码，不耗请求额度）
        run: |
          cat > wrangler.toml <<EOF
          name = "$PROJECT"
          compatibility_date = "2026-10-01"
          workers_dev = true
          [assets]
          directory = "./site"
          not_found_handling = "none"
          EOF
          wrangler deploy --message "deutsch-lernen-site@$(git -C hb rev-parse --short HEAD)"
      - name: 检查
        run: |
          set -e
          url=https://$PROJECT.uuoo.workers.dev
          for i in $(seq 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/"); echo "首页 → $code"
            [ "$code" = 200 ] && break; sleep 6
          done
          [ "$code" = 200 ]
          for p in vido/ oeif/ sw.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p"); echo "/$p → $code"; [ "$code" = 200 ]
          done
          curl -s "$url/" | grep -c '"de":"Guten Morgen' | grep -qx 0 && echo "无明文词库 ✓"
