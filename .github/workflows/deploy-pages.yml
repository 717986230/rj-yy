name: Deploy web to GitHub Pages

# 构建 apps/web 并发布到 gh-pages 分支，GitHub Pages 从该分支提供站点。
# Vido 没有自己的后端：数据存在浏览器里，在 www.uuoo.site/vido/ 登录过手册的人同步到手册后端（/api/vido）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: Deploy Vido web build
