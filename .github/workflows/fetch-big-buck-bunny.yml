name: Fetch open movie (Big Buck Bunny)

# 下载 Blender 开放电影《Big Buck Bunny》完整版（CC BY 3.0，© Blender Foundation | peach.blender.org），
# 压缩成手机友好的 H.264 + AAC，提交到 apps/web/public/media，由网站自己托管。只需在内容更新时运行一次。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-big-buck-bunny.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download film
        run: |
          set -euo pipefail
          BASE=https://download.blender.org/peach/bigbuckbunny_movies
          mkdir -p /tmp/bbb && cd /tmp/bbb
          curl -fsSL "$BASE/" -o index.html
          grep -o 'href="[^"]*"' index.html | sed 's/href=//' | tr -d '"'
          FILM=big_buck_bunny_720p_h264.mov.zip
          echo "film: $FILM"
          curl -fL --retry 3 "$BASE/$FILM" -o film.zip
          unzip -o film.zip
          mv "$(find . -name "*.mov" -size +10M | head -1)" source
          ls -la
      - name: Encode for phones
        run: |
          set -euo pipefail
          cd /tmp/bbb
          ffmpeg -v error -y -i source -vf "scale=960:-2,format=yuv420p" \
            -c:v libx264 -profile:v main -preset slow -b:v 560k -maxrate 800k -bufsize 1600k \
            -c:a aac -b:a 96k -ac 2 -ar 44100 -movflags +faststart big-buck-bunny.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,profile,pix_fmt,width,height -of compact big-buck-bunny.mp4
          test "$(stat -c %s big-buck-bunny.mp4)" -lt 95000000
      - name: Commit to the repo
        run: |
          set -euo pipefail
          dest=apps/web/public/media
          cp /tmp/bbb/big-buck-bunny.mp4 "$dest/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Add full Big Buck Bunny (CC BY 3.0, Blender Foundation)"
          git pull --rebase origin main
          git push
