name: Live check

# 线上全链路检查：Cloudflare 后端 + GitHub Pages 网站（注册登录、片库、添加删除视频、抽卡播放）
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/live-check.cjs', '.github/workflows/live-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: node scripts/live-check.cjs
        env:
          API: https://vido-api.uuoo.workers.dev/api
          SITE: https://717986230.github.io/rj-yy/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: live-check.png
