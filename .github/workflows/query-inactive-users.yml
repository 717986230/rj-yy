name: 只读查询：60 天未活跃用户

# 一次性只读查询（SELECT），不改任何数据。仓库是公开的，日志只输出用户编号和天数，不输出用户名/昵称/邮箱。
on:
  push:
    branches: [claude/project-thread-fsk911]
    paths: [.github/workflows/query-inactive-users.yml]

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g wrangler@4 >/dev/null 2>&1 && wrangler --version
      - name: 查询
        run: |
          cat > q.sql <<'SQL'
          WITH a AS (
            SELECT u.id uid, u.created,
              (SELECT MAX(exp) - 180*86400000 FROM sessions s WHERE s.uid = u.id) last_login,
              MAX(COALESCE(u.updated,0), COALESCE(u.created,0),
                  COALESCE((SELECT MAX(exp) - 180*86400000 FROM sessions s WHERE s.uid = u.id),0),
                  COALESCE((SELECT MAX(updated) FROM user_language_profiles p WHERE p.uid = u.id),0),
                  COALESCE((SELECT MAX(updated) FROM user_progress_documents d WHERE d.uid = u.id),0),
                  COALESCE((SELECT updated FROM vido_state v WHERE v.uid = u.id),0)) last_active,
              u.known, u.provider,
              (SELECT until FROM memberships m WHERE m.uid = u.id) mem_until
            FROM users u
          )
          SELECT uid,
            CAST((strftime('%s','now')*1000 - created)/86400000 AS INT) reg_days_ago,
            CAST((strftime('%s','now')*1000 - last_login)/86400000 AS INT) login_days_ago,
            CAST((strftime('%s','now')*1000 - last_active)/86400000 AS INT) active_days_ago,
            known, provider,
            CASE WHEN mem_until IS NULL THEN '' WHEN mem_until > strftime('%s','now')*1000 THEN 'member' ELSE 'expired' END mem
          FROM a ORDER BY active_days_ago DESC;
          SQL
          wrangler d1 execute uuoo_analytics --remote --json --file=q.sql > out.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("out.json","utf8"))[0].results;
            console.log("用户总数", r.length);
            console.log("60 天以上无任何活跃", r.filter(x => x.active_days_ago >= 60).length);
            console.log("60 天以上没有新登录（含无有效会话）", r.filter(x => x.login_days_ago == null || x.login_days_ago >= 60).length);
            for (const b of [7,30,60,90]) console.log(`活跃 <${b} 天:`, r.filter(x => x.active_days_ago < b).length);
            console.table(r);
          '
