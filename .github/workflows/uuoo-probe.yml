# 临时：线上验证 www.uuoo.site/vido/（验证完删除，不合并）
name: uuoo probe
on:
  push:
    branches: [claude/project-thread-yid8z0]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 120
          echo "== handbook home card"; curl -sS https://www.uuoo.site/ | grep -o '看视频学德语' | head -1
          echo "== /vido/"; curl -sSI https://www.uuoo.site/vido/ | head -1
          js=$(curl -sS https://www.uuoo.site/vido/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1); echo "js=$js"
          curl -sS "https://www.uuoo.site/vido/$js" -o app.js; wc -c app.js
          for s in uuoo-analytics.uuoo.workers.dev vido-api.uuoo.workers.dev acct_token 'uuoo\\.site'; do printf '%s: ' "$s"; grep -c -- "$s" app.js; done
          echo "== media"; curl -sSI https://717986230.github.io/rj-yy/media/tears-of-steel.mp4 | head -1
          echo "== api"; curl -sS https://vido-api.uuoo.workers.dev/api/health; echo
          curl -sS -o /dev/null -w '%{http_code}\n' -H 'Authorization: Bearer not-a-real-token' https://vido-api.uuoo.workers.dev/api/auth/me
          curl -sS -o /dev/null -w 'cors preflight %{http_code} ' -X OPTIONS -H 'Origin: https://www.uuoo.site' -H 'Access-Control-Request-Method: GET' -D h.txt https://vido-api.uuoo.workers.dev/api/videos; grep -i access-control-allow-origin h.txt
          echo "== sw"; curl -sS https://www.uuoo.site/sw.js | grep -c "/vido/"
