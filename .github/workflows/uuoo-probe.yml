# 临时：只读检查 Cloudflare 上 uuoo.site 的情况（合并前删除）
name: uuoo probe
on:
  push:
    branches: [claude/project-thread-yid8z0]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: |
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          api=https://api.cloudflare.com/client/v4
          echo "== token"; cf "$api/user/tokens/verify" | jq -c '{success, status: .result.status}'
          echo "== zone"; cf "$api/zones?name=uuoo.site" | jq -c '{success, errors, zones: [.result[]? | {id, name, status}]}'
          zone=$(cf "$api/zones?name=uuoo.site" | jq -r '.result[0].id // empty')
          if [ -n "$zone" ]; then
            echo "== dns"; cf "$api/zones/$zone/dns_records?per_page=50" | jq -c '{success, errors, recs: [.result[]? | {name, type, content, proxied}]}'
            echo "== routes"; cf "$api/zones/$zone/workers/routes" | jq -c '{success, errors, routes: .result}'
          fi
          echo "== public"; dig +short www.uuoo.site; dig +short uuoo.site NS
          curl -sSI https://www.uuoo.site/ | grep -iE '^(HTTP|server|cf-ray|x-github)' || true
          curl -sSI https://www.uuoo.site/vido/ | head -3 || true
          curl -sS https://vido-api.uuoo.workers.dev/api/health; echo
