# Vido 后端（Cloudflare Workers + D1）
# 部署由 .github/workflows/deploy-pages.yml 完成：它会自动创建 D1 数据库、填入 database_id、执行迁移并设置 JWT_SECRET
name = "vido-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# 允许跨域访问的前端地址，逗号分隔
CORS_ORIGIN = "https://717986230.github.io,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "vido"
# 本地开发（wrangler dev）用任意值即可；CI 部署前会替换成真实 ID
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
